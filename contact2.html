<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>蝶群二维码 · 鱼吃猫工作室</title>
    <link rel="icon" href="data:," />
    <style>
* {
  box-sizing: border-box;
}

:root {
  --page-background: #fff;
  --ink: #1d1d1f;
  --muted: #a7a7aa;
  --pink: #efacde;
  --panel: rgb(255 255 255 / 82%);
  --panel-border: #ececef;
}

html,
body {
  width: 100%;
  height: 100%;
  margin: 0;
  overflow: hidden;
  background: var(--page-background);
  font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}

#scene {
  display: block;
  width: 100%;
  height: 100%;
  cursor: grab;
  touch-action: none;
}

#scene:active {
  cursor: grabbing;
}

.scan-qr {
  position: fixed;
  display: none;
  top: 50%;
  left: 50%;
  z-index: 2;
  width: min(58vmin, 520px);
  height: auto;
  pointer-events: none;
  opacity: 0;
  transform: translate(-50%, -50%) scale(.985);
  transition: opacity 240ms ease, transform 360ms ease;
}

.scan-qr.is-visible {
  opacity: 1;
  transform: translate(-50%, -50%) scale(1);
}

.link-panel {
  position: fixed;
  right: auto;
  bottom: max(18px, env(safe-area-inset-bottom));
  left: 50%;
  display: flex;
  width: auto;
  min-height: 44px;
  padding: 0 22px;
  align-items: center;
  background: var(--panel);
  border: 1px solid var(--panel-border);
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 2px;
  white-space: nowrap;
  border-radius: 999px;
  box-shadow: 0 10px 32px rgb(29 29 31 / 8%);
  backdrop-filter: blur(18px) saturate(1.08);
  transform: translateX(-50%);
}

.link-panel::before {
  width: 5px;
  height: 5px;
  content: '';
  background: var(--pink);
  transform: rotate(45deg);
}

@media (max-width: 639px) {
  .link-panel {
    bottom: max(12px, env(safe-area-inset-bottom));
    max-width: calc(100vw - 24px);
    min-height: 42px;
    padding: 0 16px;
    font-size: 10px;
    letter-spacing: 1px;
  }

  .scan-qr {
    width: min(78vw, 440px);
  }
}

    </style>
  </head>
  <body>
    <canvas id="scene" aria-label="围绕月光花环飞舞、可拖动旋转并切换二维码的蝴蝶群"></canvas>
    <img class="scan-qr" src="wechat-qr-final.png" alt="微信好友二维码" />
    <div class="link-panel" role="status">点击场景可在蝶群与二维码之间切换</div>
    <script>
      (() => {
        const scene = document.querySelector('#scene');
        const scanQr = document.querySelector('.scan-qr');
        let start = null;
        let visible = false;
        let revealTimer = 0;

        scene.addEventListener('pointerdown', (event) => {
          start = { x: event.clientX, y: event.clientY };
        });

        scene.addEventListener('pointerup', (event) => {
          if (!start) return;
          const distance = Math.hypot(event.clientX - start.x, event.clientY - start.y);
          start = null;
          if (distance >= 8) return;
          visible = !visible;
          window.clearTimeout(revealTimer);
          if (visible) {
            revealTimer = window.setTimeout(() => scanQr.classList.add('is-visible'), 1150);
          } else {
            scanQr.classList.remove('is-visible');
          }
        });

        scene.addEventListener('pointercancel', () => {
          start = null;
        });
      })();
    </script>
    <script>
      // This artwork is intentionally motion-first. Some embedded previews
      // report reduced motion by default and would otherwise freeze the swarm.
      const nativeMatchMedia = window.matchMedia.bind(window);
      window.matchMedia = (query) => query === "(prefers-reduced-motion: reduce)"
        ? { matches: false, media: query, onchange: null,
            addListener() {}, removeListener() {},
            addEventListener() {}, removeEventListener() {},
            dispatchEvent() { return false; } }
        : nativeMatchMedia(query);
    </script>
